<!DOCTYPE html>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Lobster&family=Satisfy&display=swap');
    
    
    body{

        margin: 0%;
       background-color: #eecda0;
    }

    h2{
        
        font-family:'Dancing Script', cursive;
        color: white;
    }

    .navbar{
        position:relative;
        display:flex;
        align-items: center;
        gap:5px;
        padding:8px;
        width:fit-content;

    }
    .navbar a {
        position: relative;
        z-index: 2;
        padding:10px 18px;
        color:white;
        text-decoration: none;
    }

    .indicator{
        position: absolute;
        z-index:1;
        /*initial position*/
        left:8px;
        top:8px;
        width:0;
        height:40px;
        border-radius:50px;
        background:rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.15),
        inset 0 1px 3px rgba(255, 255, 255, 0.3);
        transition:
         left 0.35s ease,
        width 0.35s ease;

    }
    .carousel{
        position: relative;
        width: 100%;
        height: 400px;
        overflow: hidden;
    }
    .slide{
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .slide.active{
        display:block;
    }

    
    
</style>
<html lang ="es">
    <body>

    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content ="width=device-width, initial-scale=1.0">
        <title>Luna Brew</title>

    </head>


    <h2>LUNA BREW</h2>


    <center>
    <nav class="navbar">

        <div class="indicator"></div>

        <a href="#Home" class="active">Home</a>
        <a href="#Menu">Menu</a>
        <a href="#About">About us</a>
    </nav>
    </center>

    <section id="Home">
        welcome to my cafe
    </section>
    <section id="Menu">
        <h2>our menu</h2>
    </section>
    <section id="About">
        <h2>about us</h2>
    </section>

    <div class="carousel">
        <img src="images/img_1.jpeg" width="50px" class="slide active">
        <img src="images/img_2.jpeg" class="slide">
        <img src="images/img_3.jpeg" class="slide">
        
    </div>

    <script>
        const navbar = document.querySelector(".navbar");
        const links =document.querySelectorAll(".navbar a");
        const indicator= document.querySelector(".indicator");

        function moveIndicator(link) {
            indicator.style.left=link.offsetLeft +"px";
            indicator.style.width=link.offsetWidth + "px";
        }
        
        const activeLink=document.querySelector(".navbar a.active");
        moveIndicator(activeLink);
        links.forEach(link =>{
            link.addEventListener("click", function(){
                
                links.forEach(elemento => elemento.classList.remove("active"));
                this.classList.add("active");
                moveIndicator(this);
            });
        });
    </script>





        


        
    </body>
</html>
